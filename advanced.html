<!DOCTYPE html>
<html lang = "en">
    <head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <style>
            body{color:darkmagenta;

            .numbered{

            <h1> Advanced HTML Noted</h1>

                <li>This is the first thing</li>

            </ol>

                <li><a href="https://www.stockvault.net/data/2016/05/20/198875/preview16.jpg" target blank>Apple</a></li>
