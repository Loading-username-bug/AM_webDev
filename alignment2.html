<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 8px;
            }
            #box, #boxtwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color: azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                flex: ;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <div id="box-wrapper">
            <div id="box" onmouseover= "dissapear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="boxtwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
          <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <button onclick="color()">Click Me</button>
        <button onclick="show()" id="showMore">Show More</button>
        <script>
            //MAKES IT INTERACTIVE
            function color(){
                let newColor = document.getElementById("colorPicker").value 
                document.getElementById("box").style.backgroundColor = newColor
            }
            function dissapear(){
                document.getElementById("boxtwo").style.display = 'none'
            }
            function appear(){
                document.getElementById("boxtwo").style.display = "block"
            }
            function show(){
                let element = document.getElementByID("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }else{
                    element.style.display = "flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
